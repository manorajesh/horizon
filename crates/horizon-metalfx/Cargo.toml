[package]
name = "horizon-metalfx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MetalFX frame interpolation on wgpu's Metal objects: the Objective-C calls the crates that forbid unsafe code can't make"

[target.'cfg(target_os = "macos")'.dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
# MetalFX itself is loaded at run time, never linked: the game still starts on macOS 11 and 12.
libc = "0.2"
# The versions wgpu-hal already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLAllocation", "MTLCommandBuffer", "MTLCommandQueue", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture"] }
wgpu = { version = "30.0.1", default-features = false, features = ["metal", "wgsl"] }

[lints]
workspace = true
